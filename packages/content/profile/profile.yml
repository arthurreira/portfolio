# Credentials and skills. Language-neutral on purpose: these are proper nouns,
# and the chat translates surrounding prose per locale anyway.
#
# `level` mirrors the tiering on the GitHub profile README and must be kept:
#   core      — worked with substantially
#   working   — reached for as needed
#   exploring — actively learning, not claimed as expertise

education:
  - school: Savo Vocational College
    program: Software Development
    note: Graduated. Finnish name Savon ammattiopisto.

certifications:
  - name: Microsoft Azure Fundamentals
    code: AZ-900
    issuer: Microsoft
    status: certified
  - name: AWS Certified Cloud Practitioner
    code: CLF-C02
    issuer: Amazon Web Services
    status: certified
  - name: AWS Certified AI Practitioner
    code: AIF-C01
    issuer: Amazon Web Services
    status: certified
  - name: Microsoft Azure AI Fundamentals
    code: AI-900
    issuer: Microsoft
    status: in-progress

# Only what has actually been stated. Anything not listed here is not a "no" —
# it is simply unstated, and the chat sends those enquiries to the contact page
# instead of guessing. Keeps this from rotting into a stale status line.
availability:
